name: CPU validation
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.14'
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          uv sync --locked
      - name: Record hosted image revision
        run: printf '%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_STEP_SUMMARY"
      - run: ./scripts/validate
      - run: ./scripts/build-public-report
      - run: ./scripts/reproduce --contract-only
      - run: cat dist/report.md >> "$GITHUB_STEP_SUMMARY"
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.14'
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          uv sync --locked
      - name: Record hosted image revision
        run: printf '%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_STEP_SUMMARY"
      - run: ./scripts/research init tiny-reference
      - run: ./scripts/research run tiny-reference
      - name: Require Session 01 genuine private transition proof
        run: ./scripts/s04-private
      - name: Genuine-proof result and assurance boundary
        if: always()
        run: ./scripts/research summary >> "$GITHUB_STEP_SUMMARY"
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.14'
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          uv sync --locked
      - name: Record hosted image revision
        run: printf '%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_STEP_SUMMARY"
      - run: ./scripts/research init conformance
      - run: ./scripts/research run conformance
      - name: Independent oracle and serialization outcome
        if: always()
        run: ./scripts/research summary >> "$GITHUB_STEP_SUMMARY"
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.14'
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          uv sync --locked
      - name: Record hosted image revision
        run: printf '%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Session 03 registry and scientific references
        run: |
          PYTHONPATH=src uv run --locked python scripts/check_research.py
          PYTHONPATH=src uv run --locked python specifications/validate.py
  required-cpu:
    if: always()
    needs: [validate, proof, conformance, registry]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Require all mandatory jobs, including genuine proof
        env:
          FOUNDATION: ${{ needs.validate.result }}
          PROOF: ${{ needs.proof.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          REGISTRY: ${{ needs.registry.result }}
        run: test "$FOUNDATION" = success && test "$PROOF" = success && test "$CONFORMANCE" = success && test "$REGISTRY" = success
