name: CPU validation
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          source ./scripts/install-rust-toolchain
          uv sync --locked
      - name: Record runner image revision
        run: |
          printf '%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_STEP_SUMMARY"
      - run: ./scripts/validate
      - run: ./scripts/build-public-report
      - run: ./scripts/reproduce --contract-only
      - name: Bounded job summary
        run: cat dist/report.md >> "$GITHUB_STEP_SUMMARY"
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.14'
      - name: Install locked tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          source ./scripts/install-rust-toolchain
          uv sync --locked
      - run: ./scripts/research proof
  required-cpu:
    if: always()
    needs: [validate, proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Require all mandatory jobs
        env:
          VALIDATION: ${{ needs.validate.result }}
          PROOF: ${{ needs.proof.result }}
        run: test "$VALIDATION" = success && test "$PROOF" = success
