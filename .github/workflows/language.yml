name: Language conformance and CPU adapter
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
permissions: {}
concurrency:
  group: language-${{ github.ref }}
  cancel-in-progress: true
jobs:
  language:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.14'
      - name: Install pinned CPU tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          source ./scripts/install-rust-toolchain
          uv sync --locked --group ml
      - run: ./scripts/validate-language
