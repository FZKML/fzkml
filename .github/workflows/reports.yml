name: Approved public reports
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-reports
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: public-reports
    env:
      S04_PUBLICATION_CONTEXT: protected-public-reports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.14'
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          source ./scripts/install-rust-toolchain
          uv sync --locked
      - name: Record hosted image revision
        run: printf '%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_STEP_SUMMARY"
      - run: ./scripts/validate
      - run: ./scripts/research init tiny-reference
      - run: ./scripts/research run tiny-reference
      - name: Build actual or explicitly failed scientific evidence
        if: always()
        run: ./scripts/s04-report
      - name: Bounded job summary
        if: always()
        run: ./scripts/research summary >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact public report regeneration
        id: public
        if: always()
        run: ./scripts/s04-report --verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.public.outcome == 'success'
        with:
          name: public-report-${{ github.sha }}
          path: |
            dist/
            reports/s04-publication-receipt.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
