name: Governance
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - run: |
          python -m pip install --require-hashes -r tools-requirements.txt
          uv sync --locked
      - name: Validate governance, assets, and citation
        run: |
          uv run --locked python scripts/check_governance.py
          uv run --locked python scripts/check_citation.py
          uv run --locked python -m unittest discover -s tests -p test_governance.py -v
          uv run --locked python scripts/build_source.py
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.14'
      - name: Check every new author and coauthor sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
