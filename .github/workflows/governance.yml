name: Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip check
      - name: Validate governance, assets, and citation
        run: |
          python scripts/check_governance.py
          python scripts/check_citation.py
          python -m unittest discover -s tests -v
          python scripts/build_source.py
      - name: Publish inventory and provenance diff
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p reports
          cp compliance/files.json compliance/dependencies.json assets/manifest.json reports/
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff "$BASE_SHA" HEAD -- compliance assets/manifest.json requirements-dev.txt > reports/inventory.diff
          else
            git show HEAD -- compliance assets/manifest.json requirements-dev.txt > reports/inventory.diff
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: governance-evidence
          path: |
            reports/
            dist/
          retention-days: 14
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every new author and coauthor sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
