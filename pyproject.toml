[project]
name = "fzkml-ci"
version = "0.1.0"
requires-python = "==3.11.14"
dependencies = ["jsonschema==4.25.1", "PyYAML==6.0.3", "referencing==0.37.0"]

[dependency-groups]
dev = ["ruff==0.14.5", "mypy==1.18.2", "types-PyYAML==6.0.12.20261122", "types-jsonschema==4.25.1.20251009", "maturin==1.8.3"]
ml = ["torch==2.5.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pyright]
include = ["src", "tests"]
